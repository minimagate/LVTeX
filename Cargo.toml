[workspace]
members = ["app", "crates/render", "crates/latex"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/minimagate/mathstral"
authors = ["Michelangelo Gubinelli"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
