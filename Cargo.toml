[workspace]
members = [".", "tools/latex-spike", "app"]
resolver = "2"

[package]
name = "mathstral-render-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-render = "=0.15.1"
tiny-skia = "=0.12.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "typst-spike"
path = "src/bin/typst-spike.rs"

[[bin]]
name = "size-baseline"
path = "src/bin/size-baseline.rs"
