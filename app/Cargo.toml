[package]
name = "mathstral"
description = "A native macOS editor for writing prose with inline math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
winit = "=0.30.13"
softbuffer = "=0.4.8"
cosmic-text = "=0.19.0"
ropey = "=1.6.1"
unicode-segmentation = "=1.13.3"
muda = { version = "=0.21.2", default-features = false }
rfd = "=0.17.2"
arboard = { version = "=3.7.0", default-features = false }
mathstral-latex.workspace = true
mathstral-render.workspace = true
mathstral-mls.workspace = true
serde_json.workspace = true
base64 = "=0.22.1"
